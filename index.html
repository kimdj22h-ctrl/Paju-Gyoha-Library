 <!DOCTYPE html>
 <html lang="ko">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경기 파주시 교하도서관</title>

 </head>
 <body>
   <!--책상 4개 -->

    <section class="desk d3">책상 3</section> 
    <section class="desk d4">책상 4</section>

    <section class="shelf bottom-row col2">책장 4</section>
    <section class="shelf bottom-row col3">책장 6</section>

    <section class="shelf bottom-row col8">책장 16</section>

   <!--계단 7칸-->
   <section class="stair st1">계단 1</section>
   <section class="stair st2">계단 2 </section>
